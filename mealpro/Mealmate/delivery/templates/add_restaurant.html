{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Restaurant - MealBuddy</title>
   <link rel="stylesheet" href="{% static 'add_restaurant.css' %}">
</head>
<body>

<div class="container">
    <div class="form-card">
        <h2>Add New Restaurant</h2>
        <p>Enter restaurant details below</p>

        <form action="{% url 'add_restaurant' %}" method="post">
            {% csrf_token %}

            <div class="input-group">
                <label>Restaurant Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="input-group">
                <label>Picture URL</label>
                <input type="text" name="picture" required>
            </div>

            <div class="input-group">
                <label>Cuisine</label>
                <input type="text" name="cuisine" required>
            </div>

            <div class="input-group">
                <label>Rating (0 - 5)</label>
                <input type="number" name="rating" min="0" max="5" step="0.5" required>
            </div>

            <button type="submit" class="submit-btn">Add Restaurant</button>
        </form>
    </div>
</div>

</body>
</html>
