{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart - MealBuddy</title>
    <link rel="stylesheet" href="{% static 'cart.css' %}">
</head>
<body>

<div class="container">

    <div class="cart-card">
        <h1>Hello, {{ username }} 👋</h1>
        <h2>Your Cart</h2>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                {% for item in itemList %}
                <tr>
                    <td>
                        <img src="{{ item.picture }}" class="item-img">
                    </td>
                    <td>{{ item.name }}</td>
                    <td>{{ item.description }}</td>
                    <td>₹ {{ item.price }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="summary">
            <h3>Total: ₹ {{ total_price }}</h3>

            <form action="{% url 'checkout' username %}">
                <button type="submit" class="checkout-btn">
                    Proceed to Checkout
                </button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
